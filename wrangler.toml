# Configuración única de Cloudflare Workers Static Assets.
# Wrangler se ejecuta desde la raíz en Cloudflare Workers Builds.
name = "ti-smartdesk-ai"
compatibility_date = "2026-10-28"
previews = { }

[build]
# Wrangler ejecuta este comando antes de preview/deploy desde la raíz.
command = "npm run build"
watch_dir = "./frontend"

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
